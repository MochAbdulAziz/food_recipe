<script type="text/babel">

// ─────────────────────────────────────────────
// DESIGN TOKENS — extracted & elevated from Flutter app
// ─────────────────────────────────────────────
const tokens = {

  bgCard:        '#FFFFFF',

  textDark:      '#2D2620',   // dark brown-grey — unchanged
  textMid:       '#6B5C4D',
  textLight:     '#A89880',
  textWhite:     '#FFFFFF',
  // Accent — amber/golden replaces flat accentRed for ratings

// ─────────────────────────────────────────────
// IOS FRAME  (inlined from assets/ios_frame.jsx)
// ─────────────────────────────────────────────

    fontSize: 15,

    zIndex: 20,
    pointerEvents: 'none',
  },

    overflowX: 'hidden',
  },

    bottom: 10, left: '50%',
    transform: 'translateX(-50%)',
    width: 140, height: 5,
    background: 'rgba(0,0,0,0.22)',
    borderRadius: 999,
    zIndex: 10,
  },
};

function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 84, darkMode = false, statusColor }) {
  const textColor = statusColor || (darkMode ? '#fff' : '#000');
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        {/* Status Bar */}
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill={textColor} />
              <path d="M3 7.5a7 7 0 0110 0" stroke={textColor} strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke={textColor} strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.6" />
            </svg>
            <div style={{ ...iosFrameStyles.batteryIcon, color: textColor }}>

              <div style={{ ...iosFrameStyles.batteryCap, background: textColor }} />

        </div>
        {/* Dynamic Island */}
        <div style={iosFrameStyles.dynamicIsland} />
        {/* App content */}
        <div style={iosFrameStyles.content}>{children}</div>
        {/* Home Indicator */}
        <div style={{ ...iosFrameStyles.homeIndicator, background: darkMode ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.22)' }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// STAR RATING
// ─────────────────────────────────────────────
function StarRating({ rating, size = 13 }) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 1 }}>
      {[1,2,3,4,5].map(i => (
        <svg key={i} width={size} height={size} viewBox="0 0 12 12" fill="none">
          <path
            d="M6 1l1.39 2.82 3.11.45-2.25 2.19.53 3.1L6 8.02l-2.78 1.54.53-3.1L1.5 4.27l3.11-.45L6 1z"
            fill={i <= full ? tokens.accentAmber : (i === full+1 && half ? 'url(#half)' : '#DDD8D2')}
          />
          {i === full+1 && half && (
            <defs>
              <linearGradient id="half" x1="0" x2="1" y1="0" y2="0">
                <stop offset="50%" stopColor={tokens.accentAmber} />
                <stop offset="50%" stopColor="#DDD8D2" />
              </linearGradient>
            </defs>
          )}
        </svg>
      ))}
    </span>
  );
}

// ─────────────────────────────────────────────
// BOTTOM NAV BAR
// ─────────────────────────────────────────────

        </svg>
        <span style={{ fontSize: 10, fontWeight: 600, color: active === 'profile' ? tokens.primary : '#C8C0B8', fontFamily: 'Poppins' }}>Profile</span>
      </button>
    </div>
  );
}

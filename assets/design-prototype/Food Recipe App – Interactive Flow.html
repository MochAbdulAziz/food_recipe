// ─────────────────────────────────────────────
// STAR RATING
// ─────────────────────────────────────────────
function Stars({ rating, size = 13 }) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 1 }}>
      {[1,2,3,4,5].map(i => (
        <svg key={i} width={size} height={size} viewBox="0 0 12 12" fill="none">
          <path
            d="M6 1l1.39 2.82 3.11.45-2.25 2.19.53 3.1L6 8.02l-2.78 1.54.53-3.1L1.5 4.27l3.11-.45L6 1z"
            fill={i <= full ? T.accentAmber : (i === full+1 && half ? `url(#starHalf${i}R${Math.round(rating*10)})` : '#DDD8D2')}
          />
          {i === full+1 && half && (
            <defs>
              <linearGradient id={`starHalf${i}R${Math.round(rating*10)}`} x1="0" x2="1" y1="0" y2="0">
                <stop offset="50%" stopColor={T.accentAmber} />
                <stop offset="50%" stopColor="#DDD8D2" />
              </linearGradient>
            </defs>
          )}
        </svg>
      ))}
    </span>
  );
}

          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: T.textLight, letterSpacing: '0.1em', marginBottom: 10 }}>

            </div>

                  <div
                    key={i}
                    onClick={() => toggleIngredient(ing)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer',

                      textDecoration: isChecked ? 'line-through' : 'none',
                      transition: 'all 0.18s',
                    }}>{ing}</span>
                  </div>

            </div>
          </div>
        )}
      </div>

      {/* Prev / Next navigation */}
      <div style={{ padding: '0 20px 24px', display: 'flex', gap: 12 }}>
        {stepIndex > 0 && (
          <button
            onClick={() => setStepIndex(s => s - 1)}
            style={{

              borderRadius: 14, fontSize: 13, fontWeight: 700, fontFamily: 'Poppins',

          onClick={() => isLast ? setFinished(true) : setStepIndex(s => s + 1)}
          style={{

              ? `linear-gradient(135deg, ${T.accentSalmon}, #C85A3C)`

  );

// APP PHONE  — single state machine for all navigation
// ─────────────────────────────────────────────
function AppPhone() {
  const [history, setHistory] = React.useState(['home']);
  const [selectedRecipe, setSelectedRecipe] = React.useState(RECIPES[1]); // katsu default
  const [favourites, setFavourites] = React.useState(['katsu']); // one pre-seeded

  const screen = history[history.length - 1];

  function navigate(to) {
    // Tab-level destinations reset the history stack
    if (['home', 'search', 'favourites', 'profile'].includes(to)) {
      setHistory([to]);
    } else {
      setHistory(prev => [...prev, to]);
    }
  }

  function goBack() {
    setHistory(prev => prev.length > 1 ? prev.slice(0, -1) : prev);
  }

  function openRecipe(recipe) {
    setSelectedRecipe(recipe);
    setHistory(prev => [...prev, 'detail']);
  }

  function toggleFav(id) {
    setFavourites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
  }

  // Status bar colour
  const lightStatusScreens = ['detail', 'cooking', 'profile', 'favourites'];
  const statusColor = lightStatusScreens.includes(screen) ? '#fff' : '#000';

  const sharedProps = {
    onNav: navigate,
    favourites,
    onToggleFav: toggleFav,
    onSelectRecipe: openRecipe,
  };

  return (
    <IosFrame time="9:41" statusColor={statusColor} width={393} height={790}>
      {screen === 'home'       && <HomeScreen        {...sharedProps} />}
      {screen === 'search'     && <SearchScreen      {...sharedProps} />}
      {screen === 'detail'     && <RecipeDetailScreen {...sharedProps} recipe={selectedRecipe} onBack={goBack} />}
      {screen === 'cooking'    && <StartCookingScreen recipe={selectedRecipe} onDone={goBack} />}
      {screen === 'favourites' && <FavouritesScreen  {...sharedProps} />}
      {screen === 'profile'    && <ProfileScreen     onNav={navigate} favourites={favourites} />}
    </IosFrame>
  );
}

              fontSize: 11, color: 'rgba(240,235,227,0.5)',
              background: 'rgba(255,255,255,0.06)',
              borderRadius: 8, padding: '4px 10px', fontFamily: 'Poppins',
            }}
          >
            {h.icon} {h.text}
          </span>
        ))}
      </div>

      <AppPhone />

      <div style={{
        marginTop: 28, fontSize: 11, color: 'rgba(240,235,227,0.2)',
        letterSpacing: '0.12em', fontFamily: 'monospace',
      }}>
        Created by Huashu-Design
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
